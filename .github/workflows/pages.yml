name: EQUINOX validated release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equinox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: npm ci
      - run: python -m pip install -r reference/requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:reference
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

      - name: Build for this repository's Pages path
        shell: bash
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH=/ npm run build
          else
            BASE_PATH="/$REPO_NAME/" npm run build
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: equinox-static-build
          path: dist
          include-hidden-files: true

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Hosted smoke
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 6 --retry-delay 10 "$DEPLOY_URL" -o page.html
          grep -q EQUINOX page.html
          curl --fail --retry 3 "${DEPLOY_URL}manifest.webmanifest"
          curl --fail --retry 3 "${DEPLOY_URL}sw.js"
